name: Public-state contract verification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: public-contract-capture
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:contracts
      # Only hashes and observations are shared; downloaded bytecode stays on the runner.
      - name: Record capture provenance
        if: always()
        run: |
          if [ -f output/contracts/capture-proof.json ]; then
            cat output/contracts/capture-proof.json >> "$GITHUB_STEP_SUMMARY"
          fi
